# Example Secret holding the LLM API key for the agentic recommendations service
# (used only when AGENT_MODE=llm). This PLACEHOLDER is kept OUTSIDE
# k8s/boutique/yamls/ on purpose: deploy.sh applies the whole yamls/ directory on
# every run, so a real key placed there would be overwritten each deploy.
#
# Create the real Secret out-of-band (recommended):
#   kubectl create secret generic recommendations-llm \
#       --from-literal=api-key='sk-or-...'
#
# The recommendations Deployment references it via secretKeyRef optional:true, so
# stub-mode deploys that never create it still start fine.
apiVersion: v1
kind: Secret
metadata:
  name: recommendations-llm
  namespace: default
type: Opaque
stringData:
  api-key: "REPLACE_ME"
