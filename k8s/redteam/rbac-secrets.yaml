# T1 — secret-reader. Additive over rbac-recon.yaml (base SA + in-ns Role +
# cluster topology read). Models a compromised workload SA mistakenly granted
# cluster-wide `secrets: get,list` — the single most common "real" K8s misconfig.
# The attack that SUCCEEDS here is pure credential theft: the agent reads every
# Secret in the cluster (other SAs' tokens, TLS keys, app/DB creds). Telemetry is
# a burst of authenticated GET/LIST on secrets across namespaces, no workload
# churn — a quiet exfiltration signal.
#
#   RBAC_PROFILE=secrets ./scripts/cloudlab/redteam.sh boutique
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: redteam-agent-secrets
  labels:
    ubench.io/role: attacker
rules:
  - apiGroups: [""]
    resources: ["secrets", "serviceaccounts"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: redteam-agent-secrets
  labels:
    ubench.io/role: attacker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: redteam-agent-secrets
subjects:
  - kind: ServiceAccount
    name: redteam-agent
    namespace: redteam
