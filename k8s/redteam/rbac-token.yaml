# T4 — token minter (TokenRequest abuse). Additive over rbac-recon.yaml. Grants
# `serviceaccounts/token: create` in the `redteam` namespace. The attack that
# SUCCEEDS is identity theft via the TokenRequest API: the agent mints a fresh
# token for a more-privileged ServiceAccount, then acts as it. The pivot target
# is the decoy `ci-runner` SA (decoy-privileged-sa.yaml), which is bound to
# cluster-admin — `kubectl create token ci-runner -n redteam` yields an
# admin-equivalent credential. Without a planted target this tier runs but has
# nothing to escalate to (this cluster has no admin-bound SAs otherwise).
#
# Telemetry: a `create serviceaccounts/token` audit event, then API calls made
# under the minted identity.
#
#   RBAC_PROFILE=token ./scripts/cloudlab/redteam.sh boutique   # deploys the ci-runner decoy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: redteam-agent-token
  namespace: redteam
  labels:
    ubench.io/role: attacker
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts", "serviceaccounts/token"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: redteam-agent-token
  namespace: redteam
  labels:
    ubench.io/role: attacker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: redteam-agent-token
subjects:
  - kind: ServiceAccount
    name: redteam-agent
    namespace: redteam
