# Default RBAC profile: a realistically OVER-permissioned read-only identity.
#
# This models the common real-world misconfiguration where a compromised
# workload's service account can read far more of the cluster than it should,
# but cannot yet write. The agent gets cluster-wide READ of topology
# (pods/services/namespaces/nodes) + full read in its own namespace, so recon
# returns real data and produces rich audit/network signal. It deliberately
# CANNOT read secrets cluster-wide, create pods, or exec — those attempts 403,
# and the forbidden audit events are high-value labeled attack signal.
#
# For a "successful escalation / lateral movement" dataset, apply
# rbac-escalated.yaml instead (broader verbs).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redteam-agent
  namespace: redteam
  labels:
    ubench.io/role: attacker
---
# Full read + limited self-service inside the attacker's own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: redteam-agent-ns
  namespace: redteam
  labels:
    ubench.io/role: attacker
rules:
  - apiGroups: ["", "apps", "batch"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets", "serviceaccounts"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: redteam-agent-ns
  namespace: redteam
  labels:
    ubench.io/role: attacker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: redteam-agent-ns
subjects:
  - kind: ServiceAccount
    name: redteam-agent
    namespace: redteam
---
# Cluster-wide READ of topology only (the over-permissioned misconfig). No
# secrets, no write verbs — cross-namespace secret reads / pod creation / exec
# will be denied and recorded as forbidden audit events.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: redteam-agent-read
  labels:
    ubench.io/role: attacker
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "namespaces", "nodes", "endpoints", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: redteam-agent-read
  labels:
    ubench.io/role: attacker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: redteam-agent-read
subjects:
  - kind: ServiceAccount
    name: redteam-agent
    namespace: redteam
