# T5 — RBAC privilege escalation / persistence. Additive over rbac-recon.yaml.
# Grants the agent `create` on (cluster)rolebindings plus the `bind` and
# `escalate` verbs on (cluster)roles. Those two verbs are the point: Kubernetes'
# anti-privilege-escalation admission check normally forbids granting rights you
# do not already hold, UNLESS you have `bind` (to bind to an existing powerful
# role) or `escalate` (to author one). So the attack that SUCCEEDS is the agent
# binding ITSELF (or a SA it controls) to cluster-admin — full takeover plus a
# durable foothold.
#
# WARNING: this creates real CLUSTER-SCOPED bindings. Teardown removes the ones
# we create and anything labelled ubench.io/role=attacker, but a binding the
# agent authors with its own name/labels will NOT be caught — audit
# `kubectl get clusterrolebindings` after an rbac/escalated run.
#
#   RBAC_PROFILE=rbac ./scripts/cloudlab/redteam.sh boutique
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: redteam-agent-rbac
  labels:
    ubench.io/role: attacker
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "clusterroles"]
    verbs: ["get", "list", "create", "update", "bind", "escalate"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings", "clusterrolebindings"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: redteam-agent-rbac
  labels:
    ubench.io/role: attacker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: redteam-agent-rbac
subjects:
  - kind: ServiceAccount
    name: redteam-agent
    namespace: redteam
