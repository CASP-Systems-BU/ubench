# Build + push the load-generator client image (wrk2 + rust proxy) to GHCR.
#
# Runs on every push to main that touches the image inputs, and on demand
# (Actions tab -> client-image -> Run workflow). Pushes two tags:
#   ghcr.io/<owner>/wrk2-client:<YYYYMMDD>-g<shortsha>   immutable, for pinning
#   ghcr.io/<owner>/wrk2-client:latest                   convenience default
#
# One-time after the first push: make the package public so CloudLab kubelets
# can pull anonymously (GitHub -> Packages -> wrk2-client -> Package settings
# -> Change visibility -> Public). Until then pulls need an imagePullSecret.
name: client-image

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'scripts/ClientDockerfile'
      - '.github/workflows/client-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and tag
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wrk2-client" >> "$GITHUB_OUTPUT"
          echo "tag=$(date -u +%Y%m%d)-g${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          # Context is client/ (the Dockerfile COPYs ./proxy) — mirrors BUILD.md.
          context: client
          file: scripts/ClientDockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Links the package to this repo in the GHCR UI.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Summary
        run: |
          echo "pushed ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }} (and :latest)" >> "$GITHUB_STEP_SUMMARY"
          echo "pin experiments with: CLIENT_IMAGE=${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
