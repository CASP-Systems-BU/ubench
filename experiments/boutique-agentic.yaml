# Agentic boutique (stub backend). The standard boutique mix PLUS the recommend
# route (client/lua/agentic.lua), which drives the now-agentic `recommendations`
# service through the frontend's /ro_recommend passthrough. With the manifest
# default AGENT_MODE=stub, each recommend is cheap, deterministic, in-cluster RPC
# fan-out — reproducible and free — so it is safe to run densely. Select the mix
# with `request: agentic`.
#
# rate is a conservative starting point (each recommend fans out to several
# services); tune it with the knee sweep in experiments/README.md.
name: boutique-agentic
benchmark: boutique
request: agentic
workers: 4
replicas:
  default: 1
load:
  threads: 4
  conns: 16
  rate: 200
total_duration_s: 600
segment_s: 600
